[package]
name = "matsuko-editor"
version = "0.1.0"
description = "Matsuko Editor（学生・初心者向けの動画編集ソフト）"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Windows で bin と lib の名前がぶつからないよう、lib 側に _lib を付ける
name = "matsuko_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
matsuko-core = { path = "../../../crates/matsuko-core" }
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "net", "fs"] }
