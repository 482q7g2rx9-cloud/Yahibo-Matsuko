# Matsuko Editor（デスクトップ版）のテストとビルド
# Windows → macOS → Linux の順で優先（docs/tauri-plan.md）。
# M5：v で始まるタグ（例 v0.2.0）を push すると、その版でビルドして GitHub の Releases に置く（自動更新の latest.json も）。
# 署名・公証・更新の署名は、リポジトリの Secrets / Variables があるときだけ行う（docs/release.md）。
name: editor

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/editor/**"
      - "crates/**"
      - "src/matsuko-editor.html"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/editor.yml"
  workflow_dispatch:

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: 中心部分のテスト（Rust）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      # 書き出しの結合テストは、配布するものと同じ LGPL 版の FFmpeg で行う
      - name: FFmpeg のキャッシュ
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/editor/src-tauri/binaries
          key: ffmpeg-x86_64-unknown-linux-gnu-${{ hashFiles('apps/editor/scripts/fetch-ffmpeg.sh', 'apps/editor/scripts/build-ffmpeg-macos.sh') }}
      - name: FFmpeg を用意する
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/editor/scripts/fetch-ffmpeg.sh x86_64-unknown-linux-gnu
      - name: テストで使う名前にする
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cp apps/editor/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu "$RUNNER_TEMP/ffmpeg/ffmpeg"
          cp apps/editor/src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu "$RUNNER_TEMP/ffmpeg/ffprobe"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -encoders | grep -i 264 || true
      - run: cargo test -p matsuko-core --locked
        env:
          MATSUKO_FFMPEG_DIR: ${{ runner.temp }}/ffmpeg

  frontend:
    name: 画面のビルド（TypeScript）
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 中心部分のテスト（TypeScript）
        run: npm test
      # ブラウザ版（src/matsuko-editor.html）は src/ui から作る生成物。作り直し忘れがないか確かめる
      - name: ブラウザ版が最新か
        run: |
          npm run build:web
          git diff --exit-code -- ../../src/matsuko-editor.html || { echo "::error::src/matsuko-editor.html が古いままです。apps/editor で npm run build:web を実行してください"; exit 1; }

  build:
    name: アプリのビルド（${{ matrix.name }}）
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS（Apple シリコン）
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          # Intel の Mac 向け。Apple シリコンのランナーでクロスコンパイルする（Intel のランナーは廃止が進んでいるため）
          - name: macOS（Intel）
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      # 自動更新の署名（ないときは更新の機能のないビルドになる）
      MATSUKO_UPDATER_PUBKEY: ${{ vars.MATSUKO_UPDATER_PUBKEY }}
      S_UPD_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      S_UPD_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows のコード署名（.pfx を base64 にしたものと、そのパスワード）
      S_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
      S_WIN_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # macOS の署名と公証
      S_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
      S_APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      S_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      S_APPLE_ID: ${{ secrets.APPLE_ID }}
      S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      S_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux のビルドに必要なライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # FFmpeg（LGPL 版）。macOS はソースからビルドするので、結果を保存して使い回す
      - name: FFmpeg のキャッシュ
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/editor/src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/editor/scripts/fetch-ffmpeg.sh', 'apps/editor/scripts/build-ffmpeg-macos.sh') }}

      - name: Intel 版 FFmpeg の高速化に使う nasm
        if: matrix.target == 'x86_64-apple-darwin' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: FFmpeg を用意する
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/editor/scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - name: 画面の部品を入れる
        working-directory: apps/editor
        run: npm ci

      # Windows：証明書を取り込み、拇印（thumbprint）を設定に入れる
      - name: Windows の署名の証明書を取り込む
        if: runner.os == 'Windows' && env.S_WIN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:S_WIN_CERT))
          $pw = ConvertTo-SecureString -String $env:S_WIN_PASS -Force -AsPlainText
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WIN_THUMBPRINT=$($c.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 版（タグのとき）・自動更新のファイル・Windows の署名を、設定の上書き（tauri build --config）にまとめる
      - name: ビルドの設定を用意する
        shell: bash
        run: |
          node -e '
            const o = {};
            const ref = process.env.GITHUB_REF || "";
            if (ref.startsWith("refs/tags/v")) o.version = ref.slice("refs/tags/v".length);
            if (process.env.S_UPD_KEY) o.bundle = { createUpdaterArtifacts: true };
            // 更新のファイルを作ったあと、Tauri が公開鍵で署名を確かめるので、設定にも公開鍵を入れる
            const pub = (process.env.MATSUKO_UPDATER_PUBKEY || "").trim();
            if (pub) o.plugins = { updater: { pubkey: pub } };
            if (process.env.WIN_THUMBPRINT) {
              o.bundle = o.bundle || {};
              o.bundle.windows = { certificateThumbprint: process.env.WIN_THUMBPRINT, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" };
            }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/tauri-overlay.json", JSON.stringify(o));
            console.log(JSON.stringify(o));
          '

      - name: アプリをビルドする
        working-directory: apps/editor
        shell: bash
        run: |
          # 値のある Secrets だけを、Tauri が読む名前で渡す（空の値を渡すと、署名しようとして失敗するため）
          [ -n "$S_UPD_KEY" ] && export TAURI_SIGNING_PRIVATE_KEY="$S_UPD_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$S_UPD_PASS"
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$S_APPLE_CERT" ]; then
            export APPLE_CERTIFICATE="$S_APPLE_CERT" APPLE_CERTIFICATE_PASSWORD="$S_APPLE_CERT_PASS" APPLE_SIGNING_IDENTITY="$S_APPLE_IDENTITY"
            [ -n "$S_APPLE_ID" ] && export APPLE_ID="$S_APPLE_ID" APPLE_PASSWORD="$S_APPLE_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM"
          fi
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/tauri-overlay.json"

      # Rust 側（Tauri）の単体テスト。画面のビルド（dist）が要るので、アプリのビルドの後に Linux だけで行う
      - name: デスクトップ側のテスト
        if: runner.os == 'Linux'
        run: cargo test -p matsuko-editor --locked

      - name: インストーラーを保存する
        uses: actions/upload-artifact@v4
        with:
          name: matsuko-editor-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 14

  # v で始まるタグのときだけ：インストーラーと自動更新の latest.json を Releases に置く
  release:
    name: リリースを作る
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: ファイルを集め、latest.json を作る
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 apps/editor/scripts/make-release.py dist out notes.md
      - name: Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --title "Matsuko Editor ${TAG#v}" --notes-file notes.md --verify-tag
