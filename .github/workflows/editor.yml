# Matsuko Editor（デスクトップ版）のテストとビルド
# Windows → macOS → Linux の順で優先（docs/tauri-plan.md）。署名は M5 で追加する。
name: editor

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/editor/**"
      - "crates/**"
      - "src/matsuko-editor.html"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/editor.yml"
  pull_request:
    paths:
      - "apps/editor/**"
      - "crates/**"
      - "src/matsuko-editor.html"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/editor.yml"
  workflow_dispatch:

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: 中心部分のテスト（Rust）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo test -p matsuko-core --locked

  frontend:
    name: 画面のビルド（TypeScript）
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json
      - run: npm ci
      - run: npm run build

  build:
    name: アプリのビルド（${{ matrix.name }}）
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS（Apple シリコン）
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux のビルドに必要なライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # FFmpeg（LGPL 版）。macOS はソースからビルドするので、結果を保存して使い回す
      - name: FFmpeg のキャッシュ
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/editor/src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/editor/scripts/fetch-ffmpeg.sh', 'apps/editor/scripts/build-ffmpeg-macos.sh') }}

      - name: FFmpeg を用意する
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/editor/scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - name: 画面の部品を入れる
        working-directory: apps/editor
        run: npm ci

      - name: アプリをビルドする
        working-directory: apps/editor
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: インストーラーを保存する
        uses: actions/upload-artifact@v4
        with:
          name: matsuko-editor-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
