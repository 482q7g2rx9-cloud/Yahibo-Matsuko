[workspace]
resolver = "2"
members = ["crates/matsuko-core", "apps/editor/src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
